<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU WildWatch — Installation demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb020'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<!-- data-mode="installation": js/main.js applies config.research (the literature
     values) and config.installation (the recommended installation: 90° camera, a
     sign per direction at its coverage edge flashing for any animal in view, the
     sign asks drivers to slow, 30% obey) and runs a stream of cars both ways.
     index.html is the ordinary presentation demo and is unchanged. -->
<body data-mode="installation">
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <div class="brand-title" id="brand-title">NTU WildWatch</div>
        <div class="brand-sub" id="brand-tagline"></div>
      </div>
      <div id="tray" class="tray">
        <span class="tray-label">Animals:</span>
      </div>
      <div id="ww-tabs-slot" class="ww-tabs-slot"></div>
      <div class="controls">
        <label class="rate-knob" title="How often animals arrive (level 4 = a group every 30 s)">
          <span>Animal activity</span>
          <input id="rate" type="range" min="1" max="10" step="1" value="4" />
        </label>
        <span class="badge badge-disabled">Installation demo · research values · 2× speed</span>
        <button id="btn-legend" type="button">Key</button>
        <button id="btn-pause" type="button">⏸ Pause</button>
        <button id="btn-reset" type="button">↺ Reset</button>
      </div>
    </header>

    <main id="stage">
      <div class="panel-head off">
        <span class="panel-tag">System OFF</span>
        <span class="panel-sub">Today: no cameras, no warning</span>
      </div>
      <div class="panel-head on">
        <span class="panel-tag">System ON</span>
        <span class="panel-sub">Recommended installation</span>
      </div>

      <section class="map-wrap" id="map-wrap-off">
        <canvas class="map" id="map-off" width="1000" height="700"></canvas>
      </section>
      <section class="map-wrap" id="map-wrap-on">
        <canvas class="map" id="map-on" width="1000" height="700"></canvas>
        <div id="legend" class="legend-box" hidden></div>
      </section>
      <div id="hint" class="hint" hidden>
        <span class="hint-dot"></span>
        <span id="hint-text"></span>
      </div>
      <div id="scenario-card" class="scenario-card" hidden></div>

      <div class="panel-dash off" id="dash-off"></div>
      <div class="panel-dash on" id="dash-on"></div>
    </main>
  </div>

  <!-- Classic script tags in dependency order. NO ES modules (file:// safe). -->
  <script src="js/config.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/car.js"></script>
  <script src="js/detection.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/scenario.js"></script>
  <script src="js/main.js"></script>
  <script src="wildwatch-dashboard.js"></script>
</body>
</html>
