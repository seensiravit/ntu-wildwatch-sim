<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU WildWatch — Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb020'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: brand + tray + controls -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-title" id="brand-title">NTU WildWatch</div>
        <div class="brand-sub" id="brand-tagline"></div>
      </div>
      <div id="tray" class="tray">
        <span class="tray-label">Animals:</span>
        <!-- Species chips are injected by dashboard.js from config -->
      </div>
      <!-- The DED dashboard extension's "Simulation | DED Dashboard" tabs are moved here -->
      <div id="ww-tabs-slot" class="ww-tabs-slot"></div>
      <div class="controls">
        <label class="rate-knob" title="Auto-demo spawn rate">
          <span>Spawn rate</span>
          <input id="rate" type="range" min="1" max="10" step="1" value="4" />
        </label>
        <span class="badge badge-disabled">Day mode – next version</span>
        <button id="btn-legend" type="button">Key</button>
        <button id="btn-pause" type="button">⏸ Pause</button>
        <button id="btn-reset" type="button">↺ Reset</button>
      </div>
    </header>

    <!-- Main: the same scene twice, side by side. Left = system OFF, right = ON.
         Both share the animals; each has its own car, cameras/signs and scoreboard.
         Grid rows: panel titles / maps / dashboards. -->
    <main id="stage">
      <div class="panel-head off">
        <span class="panel-tag">System OFF</span>
        <span class="panel-sub">Today: no cameras, no warning — the driver sees only the headlights</span>
      </div>
      <div class="panel-head on">
        <span class="panel-tag">System ON</span>
        <span class="panel-sub">With WildWatch: camera detects → signs flash → driver slows</span>
      </div>

      <section class="map-wrap" id="map-wrap-off">
        <canvas class="map" id="map-off" width="1000" height="700"></canvas>
      </section>
      <section class="map-wrap" id="map-wrap-on">
        <canvas class="map" id="map-on" width="1000" height="700"></canvas>
        <div id="legend" class="legend-box" hidden></div>
      </section>
      <div id="hint" class="hint" hidden>
        <span class="hint-dot"></span>
        <span id="hint-text">Drag an animal onto either road to try it yourself</span>
      </div>

      <!-- Per-side dashboards: built by dashboard.js -->
      <div class="panel-dash off" id="dash-off"></div>
      <div class="panel-dash on" id="dash-on"></div>
    </main>
  </div>

  <!-- Classic script tags in dependency order. NO ES modules (file:// safe). -->
  <script src="js/config.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/car.js"></script>
  <script src="js/detection.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>

  <!-- Team DED dashboard extension (vendored). Loads last so js/config.js has set
       window.WILDWATCH_CONFIG; our sim reports detections via WildWatch.record(). -->
  <script src="wildwatch-dashboard.js"></script>
</body>
</html>
