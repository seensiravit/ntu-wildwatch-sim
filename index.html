<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU WildWatch — Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb020'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: brand + tray + controls -->
    <header id="topbar">
      <div class="brand">
        <div class="brand-title" id="brand-title">NTU WildWatch</div>
        <div class="brand-sub" id="brand-tagline"></div>
      </div>
      <div id="tray" class="tray">
        <span class="tray-label">Animals:</span>
        <!-- Species chips are injected by dashboard.js from config -->
      </div>
      <div class="controls">
        <label class="rate-knob" title="Auto-demo spawn rate">
          <span>Spawn rate</span>
          <input id="rate" type="range" min="1" max="10" step="1" value="4" />
        </label>
        <button id="btn-system" class="toggle toggle-on" type="button">System: ON</button>
        <span class="badge badge-disabled">Day mode – next version</span>
        <button id="btn-legend" type="button">Key</button>
        <button id="btn-pause" type="button">⏸ Pause</button>
        <button id="btn-reset" type="button">↺ Reset</button>
      </div>
    </header>

    <!-- Main: map canvas + dashboard side panel -->
    <main id="stage">
      <section id="map-wrap">
        <canvas id="map" width="1000" height="700"></canvas>
        <div id="legend" class="legend-box" hidden></div>
        <div id="hint" class="hint" hidden>
          <span class="hint-dot"></span>
          <span id="hint-text">Drag an animal onto the road to try it yourself</span>
        </div>
      </section>
      <aside id="dashboard">
        <div id="stats-card" class="card stats-card"></div>
        <div id="camera-cards"></div>
        <div id="signal-cards"></div>
        <div id="log-card" class="card">
          <div class="card-header">Detection log</div>
          <ul id="log-list"></ul>
        </div>
      </aside>
    </main>
  </div>

  <!-- Classic script tags in dependency order. NO ES modules (file:// safe). -->
  <script src="js/config.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/car.js"></script>
  <script src="js/detection.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>

  <!-- WildWatch dashboard extension (drop-in). Replace wildwatch-dashboard.js
       with the team's real file; our sim reports detections to WildWatch.record(). -->
  <script src="wildwatch-dashboard.js"></script>
</body>
</html>
